# Déploie automatiquement sur Fly.io à chaque push sur main.
# Prérequis : secret GitHub FLY_API_TOKEN (créé avec `fly tokens create deploy`).
name: Déploiement Fly.io

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency: fly-deploy

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: flyctl deploy --remote-only --ha=false
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
